# promtool unit tests of the example's alert rules, as tests/alert-rules.nix
# converts them. Time starts at 0. Samples are a minute apart, as a series
# without a sample in the last 5 minutes is gone to Prometheus.
rule_files:
  - rules.json

evaluation_interval: 1m

tests:
  # Fixable CRITICAL and HIGH counts of one container alert as one, after a
  # day. Unfixable ones, MEDIUM ones and zero counts do not.
  - interval: 1m
    input_series:
      - series: 'homelab_image_vulnerabilities{instance="host:9100", job="node-exporter", image="example.invalid/caddy:2", container="caddy", severity="CRITICAL", fixable="true"}'
        values: '1x1600'
      - series: 'homelab_image_vulnerabilities{instance="host:9100", job="node-exporter", image="example.invalid/caddy:2", container="caddy", severity="HIGH", fixable="true"}'
        values: '2x1600'
      - series: 'homelab_image_vulnerabilities{instance="host:9100", job="node-exporter", image="example.invalid/grafana:13", container="grafana", severity="CRITICAL", fixable="false"}'
        values: '3x1600'
      - series: 'homelab_image_vulnerabilities{instance="host:9100", job="node-exporter", image="example.invalid/grafana:13", container="grafana", severity="MEDIUM", fixable="true"}'
        values: '5x1600'
      - series: 'homelab_image_vulnerabilities{instance="host:9100", job="node-exporter", image="example.invalid/grafana:13", container="grafana", severity="HIGH", fixable="true"}'
        values: '0x1600'
    alert_rule_test:
      - eval_time: 23h
        alertname: homelab-image-vulnerable
        exp_alerts: []
      - eval_time: 25h
        alertname: homelab-image-vulnerable
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: host:9100
              job: node-exporter
              image: example.invalid/caddy:2
              container: caddy
              fixable: "true"

  # A container last scanned at time 0 alerts once 3 days and the hold of
  # an hour have passed; one whose timestamp keeps up with time does not.
  - interval: 1m
    input_series:
      - series: 'homelab_image_scan_timestamp_seconds{instance="host:9100", job="node-exporter", container="caddy"}'
        values: '0x4500'
      - series: 'homelab_image_scan_timestamp_seconds{instance="host:9100", job="node-exporter", container="grafana"}'
        values: '0+60x4500'
    alert_rule_test:
      - eval_time: 72h30m
        alertname: homelab-image-scan-stale
        exp_alerts: []
      - eval_time: 74h
        alertname: homelab-image-scan-stale
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: host:9100
              job: node-exporter
              container: caddy

  # A key expiring at 20 days has 14 days left at 6 days, and alerts once
  # the hold of an hour has passed. One expiring at 30 days does not.
  - interval: 1m
    input_series:
      - series: 'homelab_tailscale_key_expiry_timestamp_seconds{instance="server1:9100", job="node-exporter"}'
        values: '1728000x8800'
      - series: 'homelab_tailscale_key_expiry_timestamp_seconds{instance="server2:9100", job="node-exporter"}'
        values: '2592000x8800'
    alert_rule_test:
      - eval_time: 6d30m
        alertname: homelab-tailscale-key-expiry
        exp_alerts: []
      - eval_time: 6d2h
        alertname: homelab-tailscale-key-expiry
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: server1:9100
              job: node-exporter

  # A host offline for 10 minutes alerts; one online, and one offline for
  # only 5 minutes after boot, do not.
  - interval: 1m
    input_series:
      - series: 'homelab_tailscale_online{instance="server1:9100", job="node-exporter"}'
        values: '0x30'
      - series: 'homelab_tailscale_online{instance="server2:9100", job="node-exporter"}'
        values: '1x30'
      - series: 'homelab_tailscale_online{instance="server3:9100", job="node-exporter"}'
        values: '0x5 1x25'
    alert_rule_test:
      - eval_time: 9m
        alertname: homelab-tailscale-down
        exp_alerts: []
      - eval_time: 11m
        alertname: homelab-tailscale-down
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: server1:9100
              job: node-exporter

  # Tailnet Lock: server1 sees it turned off and alerts after 10 minutes,
  # server2 keeps it on, and server3 only turned it off 5 minutes ago.
  # server4 has not seen the lock yet and writes no series, so it never
  # alerts.
  - interval: 1m
    input_series:
      - series: 'homelab_tailscale_lock_enabled{instance="server1:9100", job="node-exporter"}'
        values: '1x5 0x30'
      - series: 'homelab_tailscale_lock_enabled{instance="server2:9100", job="node-exporter"}'
        values: '1x35'
      - series: 'homelab_tailscale_lock_enabled{instance="server3:9100", job="node-exporter"}'
        values: '1x25 0x10'
      - series: 'homelab_tailscale_online{instance="server4:9100", job="node-exporter"}'
        values: '1x35'
    alert_rule_test:
      - eval_time: 14m
        alertname: homelab-tailnet-lock-off
        exp_alerts: []
      - eval_time: 30m
        alertname: homelab-tailnet-lock-off
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: server1:9100
              job: node-exporter
      - eval_time: 30m
        alertname: homelab-tailnet-lock-node-not-signed
        exp_alerts: []

  # A node the lock does not trust: server1 joined unsigned and alerts
  # after 10 minutes; server2 was signed within 5 minutes and does not;
  # server3 is signed. server4 has the lock off and so no series.
  - interval: 1m
    input_series:
      - series: 'homelab_tailscale_lock_node_signed{instance="server1:9100", job="node-exporter"}'
        values: '0x30'
      - series: 'homelab_tailscale_lock_node_signed{instance="server2:9100", job="node-exporter"}'
        values: '0x5 1x25'
      - series: 'homelab_tailscale_lock_node_signed{instance="server3:9100", job="node-exporter"}'
        values: '1x30'
      - series: 'homelab_tailscale_online{instance="server4:9100", job="node-exporter"}'
        values: '1x30'
    alert_rule_test:
      - eval_time: 9m
        alertname: homelab-tailnet-lock-node-not-signed
        exp_alerts: []
      - eval_time: 11m
        alertname: homelab-tailnet-lock-node-not-signed
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: server1:9100
              job: node-exporter

  # The backup repository check: server1 passes weekly and keeps up, so it
  # never alerts. server2's check fails after a day and alerts at once;
  # server4's has never passed and alerts too. server3's passed at time 0
  # and then stopped running, so it alerts 9 days later.
  - interval: 1m
    input_series:
      - series: 'homelab_backup_check_ok{instance="server1:9100", job="node-exporter"}'
        values: '1x13500'
      - series: 'homelab_backup_check_last_success_timestamp_seconds{instance="server1:9100", job="node-exporter"}'
        values: '0+60x13500'
      - series: 'homelab_backup_check_ok{instance="server2:9100", job="node-exporter"}'
        values: '1x1440 0x12060'
      - series: 'homelab_backup_check_last_success_timestamp_seconds{instance="server2:9100", job="node-exporter"}'
        values: '0x13500'
      - series: 'homelab_backup_check_ok{instance="server3:9100", job="node-exporter"}'
        values: '1x13500'
      - series: 'homelab_backup_check_last_success_timestamp_seconds{instance="server3:9100", job="node-exporter"}'
        values: '0x13500'
      - series: 'homelab_backup_check_ok{instance="server4:9100", job="node-exporter"}'
        values: '0x13500'
    alert_rule_test:
      - eval_time: 1d
        alertname: homelab-backup-check-failed
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: server4:9100
              job: node-exporter
      - eval_time: 1d10m
        alertname: homelab-backup-check-failed
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: server2:9100
              job: node-exporter
          - exp_labels:
              severity: critical
              instance: server4:9100
              job: node-exporter
      - eval_time: 9d4m
        alertname: homelab-backup-check-failed
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: server2:9100
              job: node-exporter
          - exp_labels:
              severity: critical
              instance: server4:9100
              job: node-exporter
      - eval_time: 9d10m
        alertname: homelab-backup-check-failed
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: server2:9100
              job: node-exporter
          - exp_labels:
              severity: critical
              instance: server3:9100
              job: node-exporter
          - exp_labels:
              severity: critical
              instance: server4:9100
              job: node-exporter

  # The nightly prune: server1 prunes nightly and keeps up, so it never
  # alerts. server2's prune fails after a day and alerts at once; server4's
  # has never succeeded and alerts too. server3's succeeded at time 0 and
  # then stopped running, so it alerts 2 days later.
  - interval: 1m
    input_series:
      - series: 'homelab_backup_prune_ok{instance="server1:9100", job="node-exporter"}'
        values: '1x4400'
      - series: 'homelab_backup_prune_last_success_timestamp_seconds{instance="server1:9100", job="node-exporter"}'
        values: '0+60x4400'
      - series: 'homelab_backup_prune_ok{instance="server2:9100", job="node-exporter"}'
        values: '1x1440 0x2960'
      - series: 'homelab_backup_prune_last_success_timestamp_seconds{instance="server2:9100", job="node-exporter"}'
        values: '0x4400'
      - series: 'homelab_backup_prune_ok{instance="server3:9100", job="node-exporter"}'
        values: '1x4400'
      - series: 'homelab_backup_prune_last_success_timestamp_seconds{instance="server3:9100", job="node-exporter"}'
        values: '0x4400'
      - series: 'homelab_backup_prune_ok{instance="server4:9100", job="node-exporter"}'
        values: '0x4400'
    alert_rule_test:
      - eval_time: 1d
        alertname: homelab-backup-prune-failed
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: server4:9100
              job: node-exporter
      - eval_time: 1d10m
        alertname: homelab-backup-prune-failed
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: server2:9100
              job: node-exporter
          - exp_labels:
              severity: critical
              instance: server4:9100
              job: node-exporter
      - eval_time: 2d4m
        alertname: homelab-backup-prune-failed
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: server2:9100
              job: node-exporter
          - exp_labels:
              severity: critical
              instance: server4:9100
              job: node-exporter
      - eval_time: 2d10m
        alertname: homelab-backup-prune-failed
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: server2:9100
              job: node-exporter
          - exp_labels:
              severity: critical
              instance: server3:9100
              job: node-exporter
          - exp_labels:
              severity: critical
              instance: server4:9100
              job: node-exporter

  # The restore test: server1's forgejo passes monthly and keeps up, so it
  # never alerts. Its vaultwarden fails after a day and alerts at once.
  # server2's forgejo passed at time 0 and then stopped running, so it
  # alerts 40 days later. server2's old job failed but is no longer
  # declared, and does not alert.
  - interval: 1m
    input_series:
      - series: 'homelab_backup_job_info{instance="server1:9100", job="node-exporter", backup_job="forgejo"}'
        values: '1x58500'
      - series: 'homelab_backup_job_info{instance="server1:9100", job="node-exporter", backup_job="vaultwarden"}'
        values: '1x58500'
      - series: 'homelab_backup_job_info{instance="server2:9100", job="node-exporter", backup_job="forgejo"}'
        values: '1x58500'
      - series: 'homelab_backup_restore_test_ok{instance="server1:9100", job="node-exporter", backup_job="forgejo"}'
        values: '1x58500'
      - series: 'homelab_backup_restore_test_last_success_timestamp_seconds{instance="server1:9100", job="node-exporter", backup_job="forgejo"}'
        values: '0+60x58500'
      - series: 'homelab_backup_restore_test_ok{instance="server1:9100", job="node-exporter", backup_job="vaultwarden"}'
        values: '1x1440 0x57060'
      - series: 'homelab_backup_restore_test_last_success_timestamp_seconds{instance="server1:9100", job="node-exporter", backup_job="vaultwarden"}'
        values: '0x58500'
      - series: 'homelab_backup_restore_test_ok{instance="server2:9100", job="node-exporter", backup_job="forgejo"}'
        values: '1x58500'
      - series: 'homelab_backup_restore_test_last_success_timestamp_seconds{instance="server2:9100", job="node-exporter", backup_job="forgejo"}'
        values: '0x58500'
      - series: 'homelab_backup_restore_test_ok{instance="server2:9100", job="node-exporter", backup_job="removed"}'
        values: '0x58500'
    alert_rule_test:
      - eval_time: 1d
        alertname: homelab-backup-restore-test-failed
        exp_alerts: []
      - eval_time: 1d20m
        alertname: homelab-backup-restore-test-failed
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: server1:9100
              job: node-exporter
              backup_job: vaultwarden
      - eval_time: 39d23h
        alertname: homelab-backup-restore-test-failed
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: server1:9100
              job: node-exporter
              backup_job: vaultwarden
      - eval_time: 40d20m
        alertname: homelab-backup-restore-test-failed
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: server1:9100
              job: node-exporter
              backup_job: vaultwarden
          - exp_labels:
              severity: critical
              instance: server2:9100
              job: node-exporter
              backup_job: forgejo

  # Failed restic-check, restic-prune and restic-restore-test units alert
  # in the rules above, not as failed units; any other failed unit does.
  - interval: 1m
    input_series:
      - series: 'node_systemd_unit_state{instance="host:9100", job="node-exporter", name="restic-check.service", state="failed"}'
        values: '1x20'
      - series: 'node_systemd_unit_state{instance="host:9100", job="node-exporter", name="restic-restore-test.service", state="failed"}'
        values: '1x20'
      - series: 'node_systemd_unit_state{instance="host:9100", job="node-exporter", name="restic-prune.service", state="failed"}'
        values: '1x20'
      - series: 'node_systemd_unit_state{instance="host:9100", job="node-exporter", name="example.service", state="failed"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: homelab-unit-failed
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: host:9100
              job: node-exporter
              name: example.service
              state: failed

  # A Proxmox node that stops pushing at 60 minutes alerts once 15 minutes
  # pass without a sample; one still pushing does not, and neither does
  # one silent for over 7 days.
  - interval: 1m
    input_series:
      - series: 'proxmox_node_uptime_seconds{job="proxmox-ve", node="pve1", proxmox_cluster="single-node", proxmox_node="pve1"}'
        values: '0+60x60'
      - series: 'proxmox_node_uptime_seconds{job="proxmox-ve", node="pve2", proxmox_cluster="single-node", proxmox_node="pve2"}'
        values: '0+60x200'
    alert_rule_test:
      - eval_time: 74m
        alertname: homelab-proxmox-metrics-stale
        exp_alerts: []
      - eval_time: 76m
        alertname: homelab-proxmox-metrics-stale
        exp_alerts:
          - exp_labels:
              severity: warning
              job: proxmox-ve
              node: pve1
              proxmox_cluster: single-node
              proxmox_node: pve1
      - eval_time: 8d
        alertname: homelab-proxmox-metrics-stale
        exp_alerts: []
  # OPNsense: router1's node_exporter is unreachable and alerts after 10
  # minutes; router2 answers but its API refuses the exporter, and alerts
  # too. router3 is fine on both, and router4 was down for 5 minutes only.
  - interval: 1m
    input_series:
      - series: 'up{instance="router1", job="opnsense"}'
        values: '0x30'
      - series: 'up{instance="router2", job="opnsense"}'
        values: '1x30'
      - series: 'opnsense_up{instance="router2", job="opnsense-exporter", opnsense_instance="router2"}'
        values: '0x30'
      - series: 'up{instance="router3", job="opnsense"}'
        values: '1x30'
      - series: 'opnsense_up{instance="router3", job="opnsense-exporter", opnsense_instance="router3"}'
        values: '1x30'
      - series: 'up{instance="router4", job="opnsense"}'
        values: '0x5 1x25'
    alert_rule_test:
      - eval_time: 9m
        alertname: homelab-opnsense-unreachable
        exp_alerts: []
      - eval_time: 11m
        alertname: homelab-opnsense-unreachable
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: router1
          - exp_labels:
              severity: critical
              instance: router2

  # UniFi: unpoller1 polls every minute and never alerts. unpoller2 has
  # never polled successfully (-1), and unpoller3 cannot be scraped; both
  # alert after 10 minutes. unpoller4's last poll ages from time 0, is
  # over 5 minutes old at 6 minutes, and alerts 10 minutes later.
  - interval: 1m
    input_series:
      - series: 'up{instance="unpoller1", job="unifi"}'
        values: '1x30'
      - series: 'unpoller_prometheus_cache_age_seconds{instance="unpoller1", job="unifi"}'
        values: '30x30'
      - series: 'up{instance="unpoller2", job="unifi"}'
        values: '1x30'
      - series: 'unpoller_prometheus_cache_age_seconds{instance="unpoller2", job="unifi"}'
        values: '-1x30'
      - series: 'up{instance="unpoller3", job="unifi"}'
        values: '0x30'
      - series: 'up{instance="unpoller4", job="unifi"}'
        values: '1x30'
      - series: 'unpoller_prometheus_cache_age_seconds{instance="unpoller4", job="unifi"}'
        values: '0+60x30'
    alert_rule_test:
      - eval_time: 11m
        alertname: homelab-unifi-unreachable
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: unpoller2
              job: unifi
          - exp_labels:
              severity: warning
              instance: unpoller3
              job: unifi
      - eval_time: 17m
        alertname: homelab-unifi-unreachable
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: unpoller2
              job: unifi
          - exp_labels:
              severity: warning
              instance: unpoller3
              job: unifi
          - exp_labels:
              severity: warning
              instance: unpoller4
              job: unifi
