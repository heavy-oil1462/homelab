# Example Grafana alerting provisioning file for the observability module
# (homelab.observability.alertingConfig, mounted at
# /etc/grafana/provisioning/alerting/alerting.yaml). Copy it into your config
# repo and adapt it. Grafana reads it at startup; a rebuild with a changed
# file restarts the grafana container. Rules, contact point and policy
# provisioned here are read-only in the Grafana UI.
#
# The rules query the provisioned Prometheus datasource, whose uid is fixed to
# "Prometheus" in containers/observability.nix. They need the node exporter
# (modules/observability-agent.nix, with its systemd and textfile collectors)
# scraped as the job "node-exporter", as in examples/assets/prometheus.yml. The certificate and
# site rules need the blackbox exporter (containers/observability.nix)
# scraped as the job "blackbox", also as in that file.
#
# Severity labels: "critical" for lost backups and hosts that are down,
# "warning" for the rest. The notification policy at the bottom groups the
# two separately.
#
# Annotations are Go templates over the alert's labels ({{ $labels.name }})
# and query values ({{ $values.A.Value }}); Grafana keeps them as written.
apiVersion: 1

groups:
  - orgId: 1
    name: homelab
    folder: Homelab
    interval: 1m
    rules:
      # Any systemd unit in the failed state. Backup units, the backup
      # repository check and the restore test are left out here and alert
      # as critical in their own rules below.
      - uid: homelab-unit-failed
        title: Failed systemd unit
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: Prometheus
            model:
              refId: A
              instant: true
              expr: |-
                node_systemd_unit_state{state="failed", name!~"restic-backups-.*|restic-check\\.service|restic-restore-test\\.service"} == 1
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        # No failed units means no series, which is fine.
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.name }} failed on {{ $labels.instance }}"
          description: >-
            Check it on the host with: systemctl status {{ $labels.name }}

      # A restic backup run that failed (modules/backups.nix runs every job
      # as the restic-backups-<name> unit). The unit stays failed until its
      # next run succeeds.
      - uid: homelab-backup-failed
        title: Failed backup
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: Prometheus
            model:
              refId: A
              instant: true
              expr: |-
                node_systemd_unit_state{state="failed", name=~"restic-backups-.*"} == 1
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Backup {{ $labels.name }} failed on {{ $labels.instance }}"
          description: >-
            Check the run with: journalctl -u {{ $labels.name }}.
            Restoring is described in docs/backups.md.

      # A backup with no successful run in 36 hours. After each successful
      # run modules/backups.nix writes the time into
      # homelab_backup_last_success_timestamp_seconds{backup_job="<name>"},
      # through the node exporter's textfile collector. This catches a job
      # that fails and one that stopped running: its timer gone or stopped,
      # or the host down at the run time and not caught up. Only jobs the
      # host still declares (homelab_backup_job_info) count, so a removed
      # job's leftover metric does not alert. 36h fits the default daily
      # schedule with slack; raise it if a job runs less often
      # (homelab.backups.jobs.<name>.schedule).
      - uid: homelab-backup-stale
        title: Backup stale
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: Prometheus
            model:
              refId: A
              instant: true
              expr: |-
                (time() - homelab_backup_last_success_timestamp_seconds)
                  and on (instance, backup_job) homelab_backup_job_info
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [129600] } # 36h in seconds
        noDataState: OK
        execErrState: Error
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "Backup {{ $labels.backup_job }} on {{ $labels.instance }} has not succeeded in {{ humanizeDuration $values.A.Value }}"
          description: >-
            Check the timer and the last run with:
            systemctl list-timers 'restic-backups-*' and
            journalctl -u restic-backups-{{ $labels.backup_job }}

      # A declared backup job that has never succeeded on this host: it is
      # in homelab_backup_job_info but has no last success metric. Held for
      # 36h like "Backup stale", so a new job, or every job right after the
      # upgrade that added the metric, has its first scheduled run before
      # this fires. Run a new job once by hand to see it pass sooner
      # (docs/backups.md).
      - uid: homelab-backup-never-ran
        title: Backup never ran
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: Prometheus
            model:
              refId: A
              instant: true
              expr: |-
                homelab_backup_job_info
                  unless on (instance, backup_job) homelab_backup_last_success_timestamp_seconds
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        noDataState: OK
        execErrState: Error
        for: 36h
        labels:
          severity: critical
        annotations:
          summary: "Backup {{ $labels.backup_job }} on {{ $labels.instance }} has never succeeded"
          description: >-
            Run it once and read its log:
            systemctl start restic-backups-{{ $labels.backup_job }};
            journalctl -u restic-backups-{{ $labels.backup_job }}

      # The backup repository is damaged, or has not been checked in 9
      # days. modules/backups.nix runs restic check weekly
      # (homelab.backups.check) and writes homelab_backup_check_ok and
      # homelab_backup_check_last_success_timestamp_seconds through the node
      # exporter's textfile collector, on failure too. The jobs keep saving
      # snapshots into a damaged repository, so this is the alert that
      # finds it. A failed check is 1, an overdue one its age in seconds;
      # 9 days fits the weekly schedule with a missed week's slack. A host
      # whose check has never run has no series and does not alert.
      - uid: homelab-backup-check-failed
        title: Backup repository check failed
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: Prometheus
            model:
              refId: A
              instant: true
              expr: |-
                ((1 - homelab_backup_check_ok) == 1)
                  or ((time() - homelab_backup_check_last_success_timestamp_seconds) > 777600)
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Backup repository check on {{ $labels.instance }} failed or is overdue: run scripts/setup/restic-repair.sh on the host"
          description: >-
            Read what restic found with: journalctl -u restic-check.
            A missing or damaged pack needs a repair of the repository,
            which homelab-config's scripts/setup/restic-repair.sh runs;
            docs/backups.md has the commands. Run the check again after it
            with: systemctl start restic-check

      # A backup job whose data did not come back whole and usable, or has
      # not in 40 days. modules/backups.nix restores every job's latest
      # snapshot monthly (homelab.backups.restoreTest), with restic restore
      # --verify, sqlite3's integrity check and git fsck, and writes
      # homelab_backup_restore_test_ok and
      # homelab_backup_restore_test_last_success_timestamp_seconds per job
      # through the node exporter's textfile collector, on failure too
      # (docs/adr/0027-backups-are-restore-tested-monthly.md). A failed test
      # is 1, an overdue one its age in seconds; 40 days fits the monthly
      # schedule with a few days' slack. Only jobs the host still declares
      # alert. A job whose test has never run has no series and does not.
      - uid: homelab-backup-restore-test-failed
        title: Backup restore test failed
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: Prometheus
            model:
              refId: A
              instant: true
              expr: |-
                (
                  ((1 - homelab_backup_restore_test_ok) == 1)
                    or ((time() - homelab_backup_restore_test_last_success_timestamp_seconds) > 3456000)
                ) and on (instance, backup_job) homelab_backup_job_info
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Restore test of backup {{ $labels.backup_job }} on {{ $labels.instance }} failed or is overdue: journalctl -u restic-restore-test"
          description: >-
            Read why with: journalctl -u restic-restore-test. Each job logs
            one line, its summary or the reason it failed: no recent
            snapshot, a file restic could not restore and verify, a
            database that fails its integrity check, or a git repository
            that fails git fsck. docs/backups.md, "Restore test", says what
            to do for each. Run the test again with:
            systemctl start restic-restore-test

      # A container whose image has a known CRITICAL or HIGH vulnerability
      # with a fixed version out: a bump of its image is worth doing soon.
      # modules/vulnerability-scan.nix scans the images daily and writes
      # homelab_image_vulnerabilities{image, container, severity, fixable}
      # through the node exporter's textfile collector
      # (docs/adr/0017-running-images-are-scanned.md). The two severities
      # are summed, so a container alerts once; the series' own severity
      # label would otherwise clash with the rule's. Held for a day, so a
      # fix that is already being rolled out does not alert. The CVEs are
      # in the host's report: /var/lib/vulnerability-scan/<container>.json.
      - uid: homelab-image-vulnerable
        title: Fixable vulnerability in a running image
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: Prometheus
            model:
              refId: A
              instant: true
              expr: |-
                sum without (severity) (
                  homelab_image_vulnerabilities{fixable="true", severity=~"CRITICAL|HIGH"}
                )
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        noDataState: OK
        execErrState: Error
        for: 24h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.container }} on {{ $labels.instance }} runs {{ $values.A.Value }} fixable critical or high vulnerabilities"
          description: >-
            Its image is {{ $labels.image }}. List them on the host with:
            jq '.Results[].Vulnerabilities[]? | select((.FixedVersion // "") != "")
            | select(.Severity == "CRITICAL" or .Severity == "HIGH")'
            /var/lib/vulnerability-scan/{{ $labels.container }}.json

      # A container whose image has not been scanned successfully in 3
      # days: the scan fails for it (the image is not in podman's storage,
      # or Trivy has no database yet), or the vulnerability-scan timer no
      # longer runs. Until a container's first success its timestamp is
      # when scanning it was first tried, so one that never scans alerts
      # too. Containers the host no longer runs drop out of the metrics.
      - uid: homelab-image-scan-stale
        title: Vulnerability scan failing or stale
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: Prometheus
            model:
              refId: A
              instant: true
              expr: |-
                time() - homelab_image_scan_timestamp_seconds
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [259200] } # 3 days in seconds
        noDataState: OK
        execErrState: Error
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "The image of {{ $labels.container }} on {{ $labels.instance }} has not been scanned in {{ humanizeDuration $values.A.Value }}"
          description: >-
            Check the timer and the last run with:
            systemctl list-timers vulnerability-scan and
            journalctl -u vulnerability-scan

      # Filesystem more than 90% full. tmpfs, overlay (container layers) and
      # squashfs are left out. Frigate's /surveillance volume runs full by
      # design (containers/nvr.nix: Frigate deletes old recordings as it
      # fills), so it is excluded by mountpoint.
      - uid: homelab-disk-full
        title: Disk almost full
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: Prometheus
            model:
              refId: A
              instant: true
              expr: |-
                100 * (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs", mountpoint!="/surveillance"}
                         / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs", mountpoint!="/surveillance"})
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [90] } # percent used
        noDataState: OK
        execErrState: Error
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.mountpoint }} on {{ $labels.instance }} is {{ humanize $values.A.Value }}% full"

      # A node exporter target Prometheus cannot scrape: the host is down or
      # unreachable over the tailnet.
      - uid: homelab-host-down
        title: Host down
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: Prometheus
            model:
              refId: A
              instant: true
              expr: |-
                up{job="node-exporter"}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} is down"

      # A site whose certificate runs out within 14 days. The blackbox
      # exporter (containers/observability.nix) probes the URLs in
      # homelab.observability.probeTargets through Caddy, as clients reach
      # them, and reports the earliest expiry in the chain it was served.
      # A site whose certificate is already invalid has no expiry series;
      # "Site down or certificate invalid" below catches it.
      - uid: homelab-cert-expiry
        title: Certificate expires soon
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: Prometheus
            model:
              refId: A
              instant: true
              expr: |-
                (probe_ssl_earliest_cert_expiry{job="blackbox"} - time()) / 86400
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [14] } # days left
        noDataState: OK
        execErrState: Error
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "The certificate of {{ $labels.instance }} expires in {{ humanize $values.A.Value }} days"
          description: >-
            The acme module renews certificates well before this, so renewal
            has been failing; check it with: journalctl -u 'acme-*'

      # A host whose Tailscale node key runs out within 14 days, or has run
      # out. Servers take SSH on the tailnet only (modules/firewall.nix),
      # so an expired key locks the owner out. modules/tailscale.nix writes
      # the expiry every 5 minutes; a host with expiry disabled has no
      # series (homelab_tailscale_key_expiry_disabled is 1 instead).
      - uid: homelab-tailscale-key-expiry
        title: Tailscale key expires soon
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: Prometheus
            model:
              refId: A
              instant: true
              expr: |-
                (homelab_tailscale_key_expiry_timestamp_seconds - time()) / 86400
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [14] } # days left
        noDataState: OK
        execErrState: Error
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "The Tailscale key of {{ $labels.instance }} expires in {{ humanize $values.A.Value }} days"
          description: >-
            Renew it with tailscale up --force-reauth on the host while SSH
            still works, or disable key expiry for the machine in the
            Tailscale admin console (README, "Tailscale key expiry").

      # A host that is logged out of the tailnet or not connected to its
      # control plane for 10 minutes: an expired key, a logout, or
      # tailscaled down. A host Prometheus cannot reach at all is
      # "Host down" instead.
      - uid: homelab-tailscale-down
        title: Tailscale down
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: Prometheus
            model:
              refId: A
              instant: true
              expr: |-
                homelab_tailscale_online
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
        noDataState: OK
        execErrState: Error
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} is not connected to the tailnet"
          description: >-
            Check it on the host with: tailscale status and
            journalctl -u tailscaled -u tailscale-metrics

      # Tailnet Lock is off on a host that has seen it on
      # (docs/adr/0028-tailnet-lock-decides-which-nodes-join.md): someone
      # used a disablement secret, and any node the control plane adds can
      # join again. modules/tailscale.nix writes the series only once the
      # host has seen the lock on, so a tailnet without it has no alert.
      - uid: homelab-tailnet-lock-off
        title: Tailnet Lock off
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: Prometheus
            model:
              refId: A
              instant: true
              expr: |-
                homelab_tailscale_lock_enabled
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
        noDataState: OK
        execErrState: Error
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Tailnet Lock is off, as {{ $labels.instance }} sees it"
          description: >-
            Nobody should turn it off but the owner, with a disablement
            secret from the recovery card. Check tailscale lock status and
            tailscale lock log on a signing node, then the Tailscale admin
            console for nodes nobody added.

      # The lock is on and does not trust this host's node key: a new or
      # re-keyed node nobody signed yet, or one whose signature was
      # revoked. Its peers drop its traffic, so it is off the tailnet in
      # all but name. Only written while the lock is on.
      - uid: homelab-tailnet-lock-node-not-signed
        title: Node not signed for Tailnet Lock
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: Prometheus
            model:
              refId: A
              instant: true
              expr: |-
                homelab_tailscale_lock_node_signed
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
        noDataState: OK
        execErrState: Error
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} is not signed for Tailnet Lock: run tailscale lock sign from a signing node (homelab-config docs/tailnet-lock.md)"
          description: >-
            On a signing node, find the node key in tailscale lock status
            under the locked-out nodes and sign it with tailscale lock sign
            <node key>. If nobody added this node, remove it in the
            Tailscale admin console instead.

      # A probed site that does not answer 2xx over valid TLS: Caddy or the
      # service behind it is down, the name does not resolve from the
      # observability host, or the certificate is expired or untrusted.
      # "or up" makes a blackbox exporter that cannot be scraped alert for
      # every site too, instead of leaving the rule without data.
      - uid: homelab-probe-failed
        title: Site down or certificate invalid
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: Prometheus
            model:
              refId: A
              instant: true
              expr: |-
                probe_success{job="blackbox"} or up{job="blackbox"}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} is down or its certificate is invalid"
          description: >-
            See why in Prometheus: probe_http_status_code and
            probe_failed_due_to_regex, or on the observability host with
            curl -v {{ $labels.instance }}

      # The router, from homelab.observability.scrape.opnsense
      # (docs/opnsense.md): Prometheus cannot scrape its node_exporter
      # (job opnsense), or the opnsense-exporter cannot read its API
      # (opnsense_up). Both carry the router's name as instance. An
      # exporter that is not running leaves only the first; its unit
      # alerts as a failed unit.
      - uid: homelab-opnsense-unreachable
        title: OPNsense unreachable
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: Prometheus
            model:
              refId: A
              instant: true
              expr: |-
                min by (instance) (up{job="opnsense"} or opnsense_up{job="opnsense-exporter"})
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
        noDataState: OK
        execErrState: Error
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "OPNsense {{ $labels.instance }} is unreachable, or its API refuses the exporter"
          description: >-
            Check up{job="opnsense"} and opnsense_up in Prometheus. If the
            router answers but opnsense_up is 0, the API refused the key:
            journalctl -u podman-opnsense-exporter on the observability
            host says why (docs/opnsense.md).

      # The UniFi controller, from homelab.observability.scrape.unifi
      # (docs/unifi.md): unpoller polls it every minute and keeps serving
      # the last good poll, so a controller it cannot reach shows as the
      # age of that poll, over 5 minutes, or -1 when none has succeeded.
      # "or up" covers an unpoller Prometheus cannot scrape.
      - uid: homelab-unifi-unreachable
        title: UniFi controller unreachable
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: Prometheus
            model:
              refId: A
              instant: true
              expr: |-
                (unpoller_prometheus_cache_age_seconds{job="unifi"} >= 0 < 300) * 0 + 1 or up{job="unifi"} * 0
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
        noDataState: OK
        execErrState: Error
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "unpoller has not polled the UniFi controller {{ $labels.instance }} for 15 minutes"
          description: >-
            journalctl -u podman-unpoller on the observability host says
            why: the controller down, its certificate not the pinned one,
            or the user's password refused (docs/unifi.md).

      # A Proxmox VE node that pushed its metrics over OTLP
      # (homelab.observability.otlpReceiver, docs/proxmox.md) within the
      # last 7 days, but nothing in the last 15 minutes: the node is down,
      # its metric server is off or failing, or the push no longer gets
      # through. Pushed series have no up to watch, so the rule compares
      # the two windows; a node never seen, or silent for over 7 days, has
      # no series and does not alert.
      - uid: homelab-proxmox-metrics-stale
        title: Proxmox metrics stale
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: Prometheus
            model:
              refId: A
              instant: true
              expr: |-
                count_over_time(proxmox_node_uptime_seconds{job="proxmox-ve"}[7d])
                  unless count_over_time(proxmox_node_uptime_seconds{job="proxmox-ve"}[15m])
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        noDataState: OK
        execErrState: Error
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "Proxmox node {{ $labels.node }} has sent no metrics for 15 minutes"
          description: >-
            Check the node is up, and its metric server under Datacenter,
            Metric Server; on the observability host, see that the
            otlp-receiver socket and Caddy run: journalctl -u otlp-receiver

# One contact point for everything. Replace the URL with your own receiver;
# the placeholder posts Grafana's webhook JSON to an ntfy topic, which ntfy
# turns into a readable message with its built-in "grafana" template.
#
# Keep credentials out of this file (it ends up in the Nix store). Grafana
# expands $__file{path} and $VAR in provisioning files, so a token can come
# from a file provisioned out of band under /var/lib/secrets/, e.g.
#
#   authorization_scheme: Bearer
#   authorization_credentials: $__file{/var/lib/secrets/grafana-ntfy-token}
#
# The file has to be mounted into the grafana container to be readable; the
# observability module mounts nothing for it, so add the volume in your host
# config.
contactPoints:
  - orgId: 1
    name: homelab-default
    receivers:
      - uid: homelab-default-webhook
        type: webhook
        settings:
          url: https://ntfy.example.com/homelab-alerts?template=grafana
          httpMethod: POST
        disableResolveMessage: false

# Everything goes to homelab-default. Critical alerts get their own groups
# (so they are never batched with warnings), a shorter wait and a shorter
# repeat interval. This replaces Grafana's whole notification policy tree.
policies:
  - orgId: 1
    receiver: homelab-default
    group_by: [grafana_folder, alertname]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 12h
    routes:
      - receiver: homelab-default
        object_matchers:
          - [severity, "=", critical]
        group_by: [grafana_folder, alertname, instance]
        group_wait: 10s
        group_interval: 1m
        repeat_interval: 4h
