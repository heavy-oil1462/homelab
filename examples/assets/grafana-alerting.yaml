# Example Grafana alerting provisioning file for the observability module
# (homelab.observability.alertingConfig, mounted at
# /etc/grafana/provisioning/alerting/alerting.yaml). Copy it into your config
# repo and adapt it. Grafana reads it at startup; a rebuild with a changed
# file restarts the grafana container. Rules, contact point and policy
# provisioned here are read-only in the Grafana UI.
#
# The rules query the provisioned Prometheus datasource, whose uid is fixed to
# "Prometheus" in containers/observability.nix. They need the node exporter
# (modules/observability-agent.nix, with its systemd and textfile collectors)
# scraped as the job "node-exporter", as in examples/assets/prometheus.yml. The certificate and
# site rules need the blackbox exporter (containers/observability.nix)
# scraped as the job "blackbox", also as in that file.
#
# Severity labels: "critical" for lost backups and hosts that are down,
# "warning" for the rest. The notification policy at the bottom groups the
# two separately.
#
# Annotations are Go templates over the alert's labels ({{ $labels.name }})
# and query values ({{ $values.A.Value }}); Grafana keeps them as written.
apiVersion: 1

groups:
  - orgId: 1
    name: homelab
    folder: Homelab
    interval: 1m
    rules:
      # Any systemd unit in the failed state. Backup units are left out here
      # and alert as critical in their own rule below.
      - uid: homelab-unit-failed
        title: Failed systemd unit
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: Prometheus
            model:
              refId: A
              instant: true
              expr: |-
                node_systemd_unit_state{state="failed", name!~"restic-backups-.*"} == 1
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        # No failed units means no series, which is fine.
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.name }} failed on {{ $labels.instance }}"
          description: >-
            Check it on the host with: systemctl status {{ $labels.name }}

      # A restic backup run that failed (modules/backups.nix runs every job
      # as the restic-backups-<name> unit). The unit stays failed until its
      # next run succeeds.
      - uid: homelab-backup-failed
        title: Failed backup
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: Prometheus
            model:
              refId: A
              instant: true
              expr: |-
                node_systemd_unit_state{state="failed", name=~"restic-backups-.*"} == 1
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Backup {{ $labels.name }} failed on {{ $labels.instance }}"
          description: >-
            Check the run with: journalctl -u {{ $labels.name }}.
            Restoring is described in docs/backups.md.

      # A backup with no successful run in 36 hours. After each successful
      # run modules/backups.nix writes the time into
      # homelab_backup_last_success_timestamp_seconds{backup_job="<name>"},
      # through the node exporter's textfile collector. This catches a job
      # that fails and one that stopped running: its timer gone or stopped,
      # or the host down at the run time and not caught up. Only jobs the
      # host still declares (homelab_backup_job_info) count, so a removed
      # job's leftover metric does not alert. 36h fits the default daily
      # schedule with slack; raise it if a job runs less often
      # (homelab.backups.jobs.<name>.schedule).
      - uid: homelab-backup-stale
        title: Backup stale
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: Prometheus
            model:
              refId: A
              instant: true
              expr: |-
                (time() - homelab_backup_last_success_timestamp_seconds)
                  and on (instance, backup_job) homelab_backup_job_info
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [129600] } # 36h in seconds
        noDataState: OK
        execErrState: Error
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "Backup {{ $labels.backup_job }} on {{ $labels.instance }} has not succeeded in {{ humanizeDuration $values.A.Value }}"
          description: >-
            Check the timer and the last run with:
            systemctl list-timers 'restic-backups-*' and
            journalctl -u restic-backups-{{ $labels.backup_job }}

      # A declared backup job that has never succeeded on this host: it is
      # in homelab_backup_job_info but has no last success metric. Held for
      # 36h like "Backup stale", so a new job, or every job right after the
      # upgrade that added the metric, has its first scheduled run before
      # this fires. Run a new job once by hand to see it pass sooner
      # (docs/backups.md).
      - uid: homelab-backup-never-ran
        title: Backup never ran
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: Prometheus
            model:
              refId: A
              instant: true
              expr: |-
                homelab_backup_job_info
                  unless on (instance, backup_job) homelab_backup_last_success_timestamp_seconds
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
        noDataState: OK
        execErrState: Error
        for: 36h
        labels:
          severity: critical
        annotations:
          summary: "Backup {{ $labels.backup_job }} on {{ $labels.instance }} has never succeeded"
          description: >-
            Run it once and read its log:
            systemctl start restic-backups-{{ $labels.backup_job }};
            journalctl -u restic-backups-{{ $labels.backup_job }}

      # Filesystem more than 90% full. tmpfs, overlay (container layers) and
      # squashfs are left out. Frigate's /surveillance volume runs full by
      # design (containers/nvr.nix: Frigate deletes old recordings as it
      # fills), so it is excluded by mountpoint.
      - uid: homelab-disk-full
        title: Disk almost full
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: Prometheus
            model:
              refId: A
              instant: true
              expr: |-
                100 * (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs", mountpoint!="/surveillance"}
                         / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs", mountpoint!="/surveillance"})
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [90] } # percent used
        noDataState: OK
        execErrState: Error
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.mountpoint }} on {{ $labels.instance }} is {{ humanize $values.A.Value }}% full"

      # A node exporter target Prometheus cannot scrape: the host is down or
      # unreachable over the tailnet.
      - uid: homelab-host-down
        title: Host down
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: Prometheus
            model:
              refId: A
              instant: true
              expr: |-
                up{job="node-exporter"}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} is down"

      # A site whose certificate runs out within 14 days. The blackbox
      # exporter (containers/observability.nix) probes the URLs in
      # homelab.observability.probeTargets through Caddy, as clients reach
      # them, and reports the earliest expiry in the chain it was served.
      # A site whose certificate is already invalid has no expiry series;
      # "Site down or certificate invalid" below catches it.
      - uid: homelab-cert-expiry
        title: Certificate expires soon
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: Prometheus
            model:
              refId: A
              instant: true
              expr: |-
                (probe_ssl_earliest_cert_expiry{job="blackbox"} - time()) / 86400
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [14] } # days left
        noDataState: OK
        execErrState: Error
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "The certificate of {{ $labels.instance }} expires in {{ humanize $values.A.Value }} days"
          description: >-
            The acme module renews certificates well before this, so renewal
            has been failing; check it with: journalctl -u 'acme-*'

      # A probed site that does not answer 2xx over valid TLS: Caddy or the
      # service behind it is down, the name does not resolve from the
      # observability host, or the certificate is expired or untrusted.
      # "or up" makes a blackbox exporter that cannot be scraped alert for
      # every site too, instead of leaving the rule without data.
      - uid: homelab-probe-failed
        title: Site down or certificate invalid
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: Prometheus
            model:
              refId: A
              instant: true
              expr: |-
                probe_success{job="blackbox"} or up{job="blackbox"}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} is down or its certificate is invalid"
          description: >-
            See why in Prometheus: probe_http_status_code and
            probe_failed_due_to_regex, or on the observability host with
            curl -v {{ $labels.instance }}

# One contact point for everything. Replace the URL with your own receiver;
# the placeholder posts Grafana's webhook JSON to an ntfy topic, which ntfy
# turns into a readable message with its built-in "grafana" template.
#
# Keep credentials out of this file (it ends up in the Nix store). Grafana
# expands $__file{path} and $VAR in provisioning files, so a token can come
# from a file provisioned out of band under /var/lib/secrets/, e.g.
#
#   authorization_scheme: Bearer
#   authorization_credentials: $__file{/var/lib/secrets/grafana-ntfy-token}
#
# The file has to be mounted into the grafana container to be readable; the
# observability module mounts nothing for it, so add the volume in your host
# config.
contactPoints:
  - orgId: 1
    name: homelab-default
    receivers:
      - uid: homelab-default-webhook
        type: webhook
        settings:
          url: https://ntfy.example.com/homelab-alerts?template=grafana
          httpMethod: POST
        disableResolveMessage: false

# Everything goes to homelab-default. Critical alerts get their own groups
# (so they are never batched with warnings), a shorter wait and a shorter
# repeat interval. This replaces Grafana's whole notification policy tree.
policies:
  - orgId: 1
    receiver: homelab-default
    group_by: [grafana_folder, alertname]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 12h
    routes:
      - receiver: homelab-default
        object_matchers:
          - [severity, "=", critical]
        group_by: [grafana_folder, alertname, instance]
        group_wait: 10s
        group_interval: 1m
        repeat_interval: 4h
