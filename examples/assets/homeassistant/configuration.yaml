# Example Home Assistant configuration for the homeassistant module.
# __DOMAIN__ is replaced with homelab.domain at build time. Secrets come from
# /var/lib/secrets/homeassistant-secrets.yaml, mounted as secrets.yaml.
default_config:

automation: !include automations.yaml
script: !include scripts.yaml

# From 2026.8 Home Assistant reads this block into .storage/http on its first
# start and ignores it afterwards; the settings then live under Settings >
# System > Network. On a new install the import is a trial: confirm it there
# within five minutes, or HA restarts without these settings and answers the
# reverse proxy with 400. Since 2026.11, signing in at a non-local IP address
# (a tailnet address, for example) needs the address in the browser to match
# the one HA sees, which through a proxy holds only if the proxy is trusted
# here. A domain name, as in external_url below, is not checked.
http:
  use_x_forwarded_for: true
  trusted_proxies:
    # The reverse proxy as seen by Home Assistant. With host networking and a
    # podman reverse proxy this is the podman bridge gateway.
    - 192.0.2.1

homeassistant:
  external_url: https://smart.__DOMAIN__
