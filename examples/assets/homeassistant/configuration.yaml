# Example Home Assistant configuration for the homeassistant module.
# __DOMAIN__ is replaced with homelab.domain at build time. Secrets come from
# /var/lib/secrets/homeassistant-secrets.yaml, mounted as secrets.yaml.
default_config:

automation: !include automations.yaml
script: !include scripts.yaml

# No http: block. The homeassistant module writes the reverse proxy
# settings, use_x_forwarded_for and trusted_proxies, into .storage/http from
# homelab.homeassistant.trustedProxies before Home Assistant starts; HA has
# read the block only once since 2026.8 and drops it in 2027.2. The module
# refuses a file that still has one. Since 2026.11, signing in at a
# non-local IP address (a tailnet address, for example) needs the address in
# the browser to match the one HA sees, which through a proxy holds only if
# the proxy is trusted. A domain name, as in external_url below, is not
# checked.

homeassistant:
  external_url: https://smart.__DOMAIN__
