# Example Hyprland config for the desktop-hyprland module. The module
# installs this as ~/.config/hypr/hyprland.conf and the per-host monitor
# layout as monitors.conf.
source = ~/.config/hypr/monitors.conf

exec-once = waybar
exec-once = hyprpaper
exec-once = dunst
exec-once = hypridle
exec-once = nm-applet --indicator

input {
    kb_layout = us
}

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
}

# Note: use windowrule with match: syntax; windowrulev2 is deprecated.
windowrule = float 1, match:class ^(blueman-manager)$

$mod = SUPER
bind = $mod, Q, exec, kitty
bind = $mod, R, exec, rofi -show drun
bind = $mod, C, killactive
bind = $mod, M, exit
bind = $mod, F, fullscreen
bind = $mod, L, exec, hypr-power lock
bind = $mod SHIFT, S, exec, hypr-screenshot region
bind = , Print, exec, hypr-screenshot full
