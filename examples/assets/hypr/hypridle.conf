# Example hypridle config for the desktop-hyprland module. The module
# installs this as ~/.config/hypr/hypridle.conf. Locking always goes through
# loginctl lock-session, so lock_cmd here is the one place that starts
# hyprlock (bindings and waybar buttons trigger the same path).

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Lock after 10 minutes idle.
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# Turn the screens off two minutes after the lock.
listener {
    timeout = 720
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
