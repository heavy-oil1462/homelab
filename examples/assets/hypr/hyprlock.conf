# Example hyprlock config for the desktop-hyprland module. The module
# installs this as ~/.config/hypr/hyprlock.conf. A blurred screenshot of the
# session as background, a clock, and a password field.

background {
    monitor =
    path = screenshot
    blur_passes = 3
}

label {
    monitor =
    text = $TIME
    font_size = 64
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    placeholder_text = Password
    position = 0, -80
    halign = center
    valign = center
}
