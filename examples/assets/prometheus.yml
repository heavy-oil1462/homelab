# Example Prometheus config for the observability module. Targets use
# RFC 5737 documentation addresses; replace them with your hosts' tailnet IPs
# or names. node_exporter comes from the observability-agent module (port 9100),
# and so does the NVIDIA GPU exporter where it is enabled (port 9835).
# The blackbox exporter comes from the observability module (port 9115).
global:
  scrape_interval: 30s

# OTLP pushes, with homelab.observability.otlpReceiver.enable: Proxmox VE's
# OpenTelemetry metric server sends its metrics here (docs/proxmox.md).
# UnderscoreEscapingWithSuffixes, Prometheus 3's default, stated here, gives
# classic names: dots become underscores and the unit and _total are
# appended, so proxmox_vm_netin_total in bytes is
# proxmox_vm_netin_bytes_total, the names Grafana dashboard 23855 queries.
# service.name becomes the job label (proxmox-ve). The other resource
# attributes go to target_info only, unless promoted to labels on every
# series: Proxmox's cluster and node names are, as proxmox_cluster and
# proxmox_node. Its data points carry node, vmid, name, type, device and
# storage themselves.
otlp:
  translation_strategy: UnderscoreEscapingWithSuffixes
  promote_resource_attributes:
    - proxmox.cluster
    - proxmox.node

# A push that arrives late, after a newer one, is kept rather than refused
# as out of order. Scrapes are unaffected.
storage:
  tsdb:
    out_of_order_time_window: 10m

# Jobs the observability module writes from homelab.observability.scrape:
# OPNsense (jobs opnsense and opnsense-exporter) and UniFi (job unifi),
# through exporters on the observability host. The file has no jobs while
# nothing is enabled. Don't name a job below like one of those; Prometheus
# refuses a config with two jobs of one name.
scrape_config_files:
  - /etc/prometheus/scrape-configs.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node-exporter
    static_configs:
      - targets:
          - "192.0.2.20:9100"
          - "192.0.2.21:9100"

  # GPU load for the GPU dashboard. The exporters' addresses come from
  # homelab.observability.nvidiaGpuTargets, which the observability module
  # writes to /etc/prometheus/nvidia-gpu-targets.json; list hosts there,
  # not here.
  - job_name: nvidia-gpu
    file_sd_configs:
      - files: [/etc/prometheus/nvidia-gpu-targets.json]

  # Home Assistant metrics, authenticated with a long-lived token provisioned
  # at runtime (see the observability module; the file is mounted read-only).
  - job_name: home-assistant
    metrics_path: /api/prometheus
    authorization:
      credentials_file: /etc/prometheus/ha-token
    static_configs:
      - targets: ["192.0.2.22:8123"]

  # Availability and certificate expiry of the sites behind Caddy. The URLs
  # come from homelab.observability.probeTargets, which the observability
  # module writes to /etc/prometheus/probe-targets.json; list sites there,
  # not here. The blackbox exporter runs on the host and listens on the
  # default podman network's gateway, 10.88.0.1, which the Prometheus
  # container reaches. The relabeling passes each URL as the probe's target
  # and keeps it as the instance label.
  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_2xx_tls]
    file_sd_configs:
      - files: [/etc/prometheus/probe-targets.json]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: "10.88.0.1:9115"
